<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVaultPro</title>
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinkVaultPro" />
  </head>
  <body>
    <script>
      // Fix for cached index.html requesting old JS files
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
          if (!sessionStorage.getItem('app_reloaded')) {
            sessionStorage.setItem('app_reloaded', 'true');
            window.location.reload(true);
          }
        }
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
